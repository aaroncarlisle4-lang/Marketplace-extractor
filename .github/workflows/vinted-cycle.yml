name: Vinted Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vinted-cycle
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: workers/requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/requirements.txt

      - name: Run worker cycle
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
          VINTED_QUERY: ${{ secrets.VINTED_QUERY || 'patagonia r1' }}
          MAX_PAGES: ${{ secrets.MAX_PAGES || '1' }}
          PAGE_LOAD_TIMEOUT_SECONDS: ${{ secrets.PAGE_LOAD_TIMEOUT_SECONDS || '12' }}
          MAX_RUNTIME_SECONDS: ${{ secrets.MAX_RUNTIME_SECONDS || '120' }}
          MAX_ITEM_AGE_HOURS: ${{ secrets.MAX_ITEM_AGE_HOURS || '24' }}
          DISABLE_NOTIFY: ${{ secrets.DISABLE_NOTIFY || '0' }}
        run: python workers/run_cycle.py
