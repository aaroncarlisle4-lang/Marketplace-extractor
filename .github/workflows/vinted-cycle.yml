name: Vinted Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vinted-cycle
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: workers/requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/requirements.txt

      - name: Run worker cycle
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
          VINTED_QUERY: ${{ secrets.VINTED_QUERY || 'patagonia r1' }}
          VINTED_QUERIES: ${{ secrets.VINTED_QUERIES || 'patagonia shorts,patagonia r1,patagonia r2,patagonia r3,patagonia torrentshell jacket,patagonia h2no,patagonia goretex,patagonia ski jacket,patagonia fleece,patagonia synchilla,patagonia better sweater,patagonia snap-t,patagonia retro-x,patagonia micro puff,patagonia nano puff' }}
          VINTED_TARGET_TERMS: ${{ secrets.VINTED_TARGET_TERMS || 'shorts,belted,r1,r2,r3,torrentshell,h2no,goretex,gore-tex,ski jacket,jacket,fleece,synchilla,snap-t,better sweater,nano puff,micro puff,puffer,sweater,jumper,capilene,baggies,retro-x,das parka,down sweater,regulator,vest,gilet,parka' }}
          STRICT_TARGET_ONLY: ${{ secrets.STRICT_TARGET_ONLY || '1' }}
          MAX_PAGES: ${{ secrets.MAX_PAGES || '10' }}
          PAGE_LOAD_TIMEOUT_SECONDS: ${{ secrets.PAGE_LOAD_TIMEOUT_SECONDS || '12' }}
          MAX_RUNTIME_SECONDS: ${{ secrets.MAX_RUNTIME_SECONDS || '480' }}
          MAX_ITEM_AGE_HOURS: ${{ secrets.MAX_ITEM_AGE_HOURS || '24' }}
          DISABLE_NOTIFY: ${{ secrets.DISABLE_NOTIFY_VINTED || '0' }}
        run: python workers/run_cycle.py
