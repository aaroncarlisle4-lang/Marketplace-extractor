name: Vinted Cycle

on:
  # Started every 5 min, 08:00-21:59 UK time, by Supabase pg_cron
  # (private.dispatch_github_workflow). GitHub's own schedule trigger ran
  # only a handful of times a day and gets disabled after 60 days without
  # commits, so it isn't used.
  workflow_dispatch:

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vinted-cycle
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: workers/requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/requirements.txt

      - name: Run worker cycle
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sbgfeqanqznuhnsdekyt.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_NOTIFY_MODE: ${{ secrets.SUPABASE_NOTIFY_MODE || vars.SUPABASE_NOTIFY_MODE || 'always' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          VINTED_QUERIES: >-
            patagonia r1,patagonia r2,patagonia r3,
            patagonia torrentshell jacket,patagonia h2no,patagonia goretex,
            patagonia ski jacket,patagonia fleece,patagonia synchilla,
            patagonia better sweater,patagonia snap-t,patagonia retro-x,
            patagonia micro puff,patagonia nano puff
          VINTED_TARGET_TERMS: >-
            r1,r2,r3,torrentshell,h2no,goretex,gore-tex,ski jacket,jacket,
            fleece,synchilla,snap-t,better sweater,nano puff,micro puff,
            puffer,sweater,jumper,capilene,retro-x,das parka,down sweater,
            regulator,vest,gilet,parka
          STRICT_TARGET_ONLY: ${{ secrets.STRICT_TARGET_ONLY || '1' }}
          MAX_PAGES: ${{ secrets.MAX_PAGES || '10' }}
          PAGE_LOAD_TIMEOUT_SECONDS: ${{ secrets.PAGE_LOAD_TIMEOUT_SECONDS || '12' }}
          MAX_RUNTIME_SECONDS: ${{ secrets.MAX_RUNTIME_SECONDS || '480' }}
          MAX_ITEM_AGE_HOURS: ${{ secrets.MAX_ITEM_AGE_HOURS || '24' }}
          DISABLE_NOTIFY: ${{ secrets.DISABLE_NOTIFY_VINTED || '0' }}
        run: python workers/run_cycle.py
